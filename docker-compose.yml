services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: yt-tv-sqlserver
    ports:
      - "1433:1433"
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=MyP@ssw0rd2024!
      - MSSQL_PID=Developer
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD", "sleep", "1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - yt-tv-network

  ollama:
    image: ollama/ollama:latest
    container_name: yt-tv-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_NUM_GPU=1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - yt-tv-network

  ollama-pull-models:
    image: ollama/ollama:latest
    container_name: yt-tv-ollama-pull-models
    environment:
      - OLLAMA_HOST=ollama:11434
    volumes:
      - ollama-models:/root/.ollama
    networks:
      - yt-tv-network
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - "-c"
      - |
        ollama pull llama3.2:latest
        ollama pull nomic-embed-text:latest

  chroma:
    image: chromadb/chroma:1.0.0
    container_name: yt-tv-chroma
    ports:
      - "8000:8000"
    volumes:
      - chroma-data:/chroma/chroma
    networks:
      - yt-tv-network
    healthcheck:
      test: ["CMD", "sleep", "1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  eureka-server:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        MODULE_NAME: eureka-server
    container_name: yt-tv-eureka
    ports:
      - "8761:8761"
    networks:
      - yt-tv-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        MODULE_NAME: gateway-service
    container_name: yt-tv-gateway
    ports:
      - "8080:8080"
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - yt-tv-network

  user-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        MODULE_NAME: user-service
    container_name: yt-tv-user-service
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - DB_HOST=sqlserver
      - DB_PORT=1433
      - DB_NAME=yt_tv
      - DB_USERNAME=sa
      - DB_PASSWORD=MyP@ssw0rd2024!
    depends_on:
      sqlserver:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - yt-tv-network

  content-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        MODULE_NAME: content-service
    container_name: yt-tv-content-service
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - DB_HOST=sqlserver
      - DB_PORT=1433
      - DB_NAME=yt_tv
      - DB_USERNAME=sa
      - DB_PASSWORD=MyP@ssw0rd2024!
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OLLAMA_URL=http://ollama:11434
      - CHROMA_HOST=http://chroma
      - CHROMA_PORT=8000
    depends_on:
      sqlserver:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - yt-tv-network

  playlist-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        MODULE_NAME: playlist-service
    container_name: yt-tv-playlist-service
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - DB_HOST=sqlserver
      - DB_PORT=1433
      - DB_NAME=yt_tv
      - DB_USERNAME=sa
      - DB_PASSWORD=MyP@ssw0rd2024!
    depends_on:
      sqlserver:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
    networks:
      - yt-tv-network

  ai-service:
    build:
      context: .
      dockerfile: Dockerfile.microservice
      args:
        MODULE_NAME: ai-service
    container_name: yt-tv-ai-service
    environment:
      - EUREKA_CLIENT_SERVICEURL_DEFAULTZONE=http://eureka-server:8761/eureka/
      - OLLAMA_URL=http://ollama:11434
      - CHROMA_HOST=http://chroma
      - CHROMA_PORT=8000
      - MCP_SERVER_URL=http://mcp-server:3000/sse
    depends_on:
      eureka-server:
        condition: service_healthy
      ollama:
        condition: service_healthy
      chroma:
        condition: service_healthy
    networks:
      - yt-tv-network

  mcp-server:
    build:
      context: ./mcp-server
    container_name: yt-tv-mcp-server
    ports:
      - "3000:3000"
    environment:
      - DB_HOST=sqlserver
      - DB_PORT=1433
      - DB_NAME=yt_tv
      - DB_USERNAME=sa
      - DB_PASSWORD=MyP@ssw0rd2024!
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - yt-tv-network

volumes:
  mssql-data:
  ollama-models:
  chroma-data:

networks:
  yt-tv-network:
    driver: bridge
