<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>YT TV - Manage Channels</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
    <!-- CSRF Token Meta Tags -->
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>

<div class = "container mt-5">
    <a th:href="@{/dashboard}" class = "text-secondary text-decoration-none">&larr; Back to Dashboard</a>

    <div class="d-flex justify-content-between align-items-center mt-3 mb-4">
        <h1>All Channels</h1>
        <button class = "btn btn-primary" data-bs-toggle="modal" data-bs-target="#addChannelModal">Add New Channel</button>
    </div>

    <!-- Channel List Table -->
    <table class="table table-dark table-hover">
        <thread>
            <tr>
                <th>ID</th>
                <th>Thumbnail</th>
                <th>Name</th>
                <th>Youtube ID</th>
            </tr>
        </thread>

        <tbody>
        <tr th:each="c : ${channels}">
            <td th:text="${c.id}">123</td>
            <td>
                <img th:src="${c.thumbnailUrl}" alt="Channel Thumbnail" referrerpolicy="no-referrer">
            </td>
            <td th:text="${c.name}">Channel Name</td>
            <td th:text="${c.ytChannelId}">ID</td>
            <td>
                <form th:action="@{/channels/sync}" method="post" style="display:inline;">
                    <input type="hidden" name="channelId" th:value="${c.id}"/>
                    <button type="submit" class="btn btn-sm btn-outline-info">Sync Videos</button>
                </form>

                <a th:href="@{/channels/delete/{id}(id=${c.id})}"
                   class="btn btn-sm btn-outline-danger ms-2"
                   onclick="return confirm('Are you sure? This will delete the channel and all its videos.');">
                    Delete
                </a>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<!-- Alert Messages -->
<div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
    <span th:text="${success}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>
<div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
    <span th:text="${error}"></span>
    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
</div>

<!-- Add Channel Modal -->
<div class="modal fade" id="addChannelModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content" style="background-color: #1e1e1e; color: white;">
            <div class="modal-header border-0">
                <h5 class="modal-title">Add Channel Manually</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/channels/create}" method="post">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">Search Channel Name</label>
                        <input type="text" name="query" class="form-control"
                               placeholder="e.g. Veritasium, Lofi Girl, Spring Boot" required>
                        <small class="text-secondary">We will find the official channel and add it automatically.</small>
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="submit" class="btn btn-primary w-100">Search & Add</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script th:src="@{/js/sync.js}"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
