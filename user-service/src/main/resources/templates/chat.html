<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>AI TV Assistant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>

<body>
<!-- Navbar -->
<nav class="navbar navbar-dark px-4 py-3 mb-4">
    <a class="navbar-brand fw-bold" href="#"> YT TV <span class="badge bg-danger">AI</span></a>
    <a th:href="@{/dashboard}" class="btn btn-sm btn-outline-secondary">Back to Dashboard</a>
</nav>

<div class="container chat-container">
    <h3 class="text-center mb-4">What do you want to watch?</h3>

    <!-- Chat Area -->
    <div id="chat-box" class="chat-box">
        <div class="message ai-msg">
            Hello! I can curate a custom YouTube TV Experience for you. Try asking for a category like "Science", "Music", etc.
        </div>
    </div>

    <!-- Input Area -->
    <div class="input-group">
        <input type="text" id="user-input" class="form-control" placeholder="Type here..." onkeypress="handleEnter(event)">
        <button class="btn btn-danger" onclick="sendMessage()">Send</button>
    </div>
</div>

<!-- Hidden Form to start Player -->
<form id="playForm" th:action="@{/play/custom}" method="post" style="display:none;">
    <input type="hidden" name="videoIds" id="videoIdsInput"/>
</form>

<script th:inline="javascript">
    const currentUserId = /*[[${currentUserId}]]*/ 0;
    const aiEnabled = /*[[${aiEnabled}]]*/ true;
</script>
<script th:src="@{/js/chat.js}"></script>

</body>

</html>
