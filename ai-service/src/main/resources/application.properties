spring.application.name=ai-service
server.port=${PORT:8084}
eureka.client.service-url.defaultZone=${EUREKA_SERVER:http://localhost:8761/eureka/}

# AI/Ollama Configuration
spring.ai.ollama.base-url=${OLLAMA_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_CHAT_MODEL:llama3.2:latest}
spring.ai.ollama.chat.options.temperature=${OLLAMA_TEMPERATURE:0.2}
spring.ai.ollama.embedding.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text:latest}

# Chroma Vector Store Configuration
spring.ai.vectorstore.chroma.client.host=${CHROMA_HOST:http://localhost}
spring.ai.vectorstore.chroma.client.port=${CHROMA_PORT:8000}
spring.ai.vectorstore.chroma.collection-name=yt_tv_videos
spring.ai.vectorstore.chroma.initialize-schema=true

# MCP Client Configuration
spring.ai.mcp.client.enabled=${MCP_CLIENT_ENABLED:true}
spring.ai.mcp.client.connections.db-mcp.type=sse
spring.ai.mcp.client.connections.db-mcp.url=${MCP_SERVER_URL:http://localhost:3000/sse}

# Logging
logging.level.com.example.yt_tv=DEBUG
