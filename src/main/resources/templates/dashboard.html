<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>YT TV - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<nav class = "navbar navbar-dark px-4 py-3">
    <a class = "navbar-brand fw-bold" href="#">YT TV <span class = "badge bg-danger">LIVE</span></a>
    <div class = "d-flex align-items-center">
        <span class = "me-3 text-secondary">Hello, <span th:text="${username}">User</span></span>
        <a th:href="@{/logout}" class = "btn btn-sm btn-outline-danger">Logout</a>
    </div>
</nav>

<div class = "container mt-5">
    <div class = "d-flex justify-content-between align-items-center mb-4">
        <h2>My Playlists</h2>
        <button class = "btn btn-danger" data-bs-toggle="modal" data-bs-target="#createModal">+ New Playlist</button>
    </div>


    <!-- Playlist Grid -->
    <div class = "row g-4">
        <!-- Loop Playlists -->
        <div class = "col-md-3" th:each="p : ${playlists}">
            <a th:href = "@{/playlist/{id}(id=${p.id})}" class = "playlist-card p-4 h-100 d-flex
                flex-column justify-content-center align-items-center text-center">
                <h4 th:text="${p.name}">Playlist Name</h4>
                <small class = "text-secondary" th:text="${p.channels != null ? p.channels.size() + ' Channels' : '0 Channels'}">
                    0 Channels
                </small>
            </a>
        </div>

        <!-- Empty State -->
        <div class = "col-12 text-center text-secondary mt-5" th:if = "${playlists.empty}">
            <p>You have no playlists yet. Create one to start watching TV!</p>
        </div>

    </div>
</div>

<!-- Create Playlist Modal -->
<div class="modal fade" id="createModal" tabindex="-1">
    <div class = "modal-dialog">
        <div class = "modal-content">
            <div class = "modal-header border-0">
                <h5 class = "modal-title">New Playlist</h5>
                <button type = "button" class = "btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form th:action="@{/playlists/create}" method="post" th:object="${newPlaylist}">
                <div class = "modal-body">
                    <input type="text" th:field="*{name}" class = "form-control" placeholder="Playlist Name (e.g. Music, News)" required>
                </div>
                <div class = "modal-footer border-0">
                    <button type = "submit" class = "btn btn-danger w-100">Create</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
