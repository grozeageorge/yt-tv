<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title th:text="${playlist.name}">Playlist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link th:href="@{/css/styles.css}" rel="stylesheet">
</head>
<body>

<div class="container mt-5">
    <a th:href="@{/dashboard}" class="text-secondary text-decoration-none">&larr; Back to Dashboard</a>

    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mt-3 mb-4">
        <h1>
            <span class="text-danger fw-bold">Playlist:</span>
            <span th:text="${playlist.name}">Name</span>
        </h1>
        <button class="btn btn-lg btn-danger px-5">PLAY TV &#9658;</button>
    </div>

    <!-- Alert Messages -->
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="row">
        <!-- LEFT: Channel List -->
        <div class="col-md-8">
            <h4 class="mb-3">Channels</h4>

            <!-- THE DARK TABLE -->
            <table class="table table-dark table-hover align-middle">
                <tbody>
                <tr th:each="pc, iterStat : ${playlist.channels}">
                    <!-- 1. Number (1, 2, 3...) -->
                    <td class="text-secondary" th:text="${iterStat.count}">1</td>

                    <!-- 2. Thumbnail (With Fix for loading) -->
                    <td>
                        <img th:src="${pc.thumbnailUrl}"
                             style="width: 50px; height: 50px; border-radius: 50%; object-fit: cover; display:block;"
                             referrerpolicy="no-referrer"
                             alt="img">
                    </td>

                    <!-- 3. Name -->
                    <td class="fw-bold" th:text="${pc.channelName}">Channel Name</td>

                    <!-- 4. Actions -->
                    <td class="text-end">
                        <!-- SYNC BUTTON -->
                        <form th:action="@{/channels/sync}" method="post" style="display:inline;">
                            <input type="hidden" name="channelId" th:value="${pc.channelId}" />
                            <input type="hidden" name="playlistId" th:value="${playlist.id}" />
                            <button type="submit" class="btn btn-sm btn-outline-info me-1" title="Get latest videos">Sync</button>
                        </form>

                        <!-- REMOVE (From Playlist) -->
                        <a th:href="@{/playlist/remove-channel(playlistId=${playlist.id}, channelId=${pc.channelId})}"
                           class="btn btn-sm btn-outline-secondary me-1">Remove</a>

                        <!-- DELETE GLOBAL (From DB) -->
                        <a th:href="@{/channels/delete-global(channelId=${pc.channelId}, returnPlaylistId=${playlist.id})}"
                           class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('Wait! This deletes the channel from the DATABASE and ALL playlists. Are you sure?');">
                            Delete Global
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>

            <!-- Empty State -->
            <div th:if="${playlist.channels == null || playlist.channels.empty}" class="text-center text-secondary mt-5 p-5" style="background: #1e1e1e; border-radius: 10px;">
                <h4>This playlist is empty.</h4>
                <p>Search for a YouTube channel on the right to add it.</p>
            </div>
        </div>

        <!-- RIGHT: Search & Add Form -->
        <div class="col-md-4">
            <div class="card p-4 sticky-top" style="top: 20px;">
                <h5 class="mb-3 text-danger fw-bold">Add Channel</h5>
                <form th:action="@{/playlist/{id}/add-channel-query(id=${playlist.id})}" method="post">
                    <div class="mb-3">
                        <label class="form-label text-secondary">Search YouTube</label>
                        <input type="text" name="query" class="form-control"
                               placeholder="e.g. Veritasium, Lofi Girl..." required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Search & Add</button>
                </form>
                <small class="text-secondary mt-3 d-block">
                    Finds the official channel, syncs videos, and adds it to this list.
                </small>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
