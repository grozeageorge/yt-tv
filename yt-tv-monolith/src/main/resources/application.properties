# Database Configuration
# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:yt_tv}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health,metrics
management.endpoint.health.show-details=when-authorized
management.endpoints.web.base-path=/

# Application Configuration
spring.application.name=yt-tv
spring.main.web-application-type=servlet
server.port=${SERVER_PORT:8080}

# Session Security
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.timeout=30m

# AI/Ollama Configuration
spring.ai.ollama.base-url=${OLLAMA_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_CHAT_MODEL:llama3.2:latest}
spring.ai.ollama.chat.options.temperature=${OLLAMA_TEMPERATURE:0.2}
spring.ai.ollama.embedding.model=${OLLAMA_EMBEDDING_MODEL:nomic-embed-text:latest}

# Chroma Vector Store Configuration
spring.ai.vectorstore.chroma.client.host=${CHROMA_HOST:http://localhost}
spring.ai.vectorstore.chroma.client.port=${CHROMA_PORT:8000}
spring.ai.vectorstore.chroma.collection-name=yt_tv_videos
spring.ai.vectorstore.chroma.initialize-schema=true

# YouTube API
youtube.api.key=${GOOGLE_API_KEY:}

# Logging Configuration
logging.level.root=INFO
logging.level.com.example.yt_tv=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.name=${LOG_FILE:}

spring.main.allow-bean-definition-overriding=true